name: Sincronização Telegram (Gastos e Faturas)

on:
  schedule:
    # Roda a cada 2 horas durante o dia (10h, 12h, 14h, 16h, 18h, 20h e 22h UTC = 07h às 19h BRT)
    - cron: '0 10,12,14,16,18,20,22 * * *'
  workflow_dispatch:

concurrency:
  group: telegram-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sincronizar Mensagens e Anexos
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Configurar Arquivo .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            echo "$ENV_FILE" > .env
          else
            echo "::error::Secret ENV_FILE não configurado no repositório GitHub!"
            exit 1
          fi

      - name: Processar Mensagens do Telegram
        run: |
          python telegram_bot.py --sync
