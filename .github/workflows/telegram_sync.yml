name: Sincronização Telegram (Gastos, Faturas e Lembretes)

on:
  schedule:
    # A cada 2 horas entre 10h e 22h BRT (13h, 15h, 17h, 19h, 21h, 23h e 01h UTC)
    - cron: '0 13,15,17,19,21,23,1 * * *'
  workflow_dispatch:

concurrency:
  group: telegram-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sincronizar Mensagens e Anexos
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Configurar Arquivo .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            echo "$ENV_FILE" > .env
          else
            echo "::error::Secret ENV_FILE não configurado no repositório GitHub!"
            exit 1
          fi

      - name: Preparar Arquivos de Regras
        run: |
          if [ ! -f regras_categoria.json ] && [ -f regras_categoria.example.json ]; then
            cp regras_categoria.example.json regras_categoria.json
          fi
          if [ ! -f regras_telegram.json ] && [ -f regras_telegram.example.json ]; then
            cp regras_telegram.example.json regras_telegram.json
          fi

      - name: Processar Mensagens do Telegram
        run: |
          python telegram_bot.py --sync

      - name: Checar Lembretes de Gastos Fixos Previstos Hoje
        if: always()
        run: |
          # Executa no primeiro ciclo (13h UTC = 10h BRT) ou em disparo manual
          HORA_UTC=$(date -u +%H)
          if [ "$HORA_UTC" = "13" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python telegram_bot.py --checar-previstos
          fi
