name: Rotinas Mensais (Gastos Fixos e Fechamento)

on:
  schedule:
    # Todo dia 1º do mês às 09:00 UTC (06:00 Horário de Brasília)
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      acao:
        description: 'Qual rotina mensal executar?'
        required: true
        default: 'lancar_fixos'
        type: choice
        options:
          - lancar_fixos
          - fechar_mes
          - ambos

concurrency:
  group: monthly-routines
  cancel-in-progress: false

jobs:
  monthly_job:
    name: Executar Rotinas de Mês
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Configurar Arquivo .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            echo "$ENV_FILE" > .env
          else
            echo "::error::Secret ENV_FILE não configurado no repositório GitHub!"
            exit 1
          fi

      - name: Preparar Arquivos de Regras
        run: |
          if [ ! -f regras_categoria.json ] && [ -f regras_categoria.example.json ]; then
            cp regras_categoria.example.json regras_categoria.json
          fi
          if [ ! -f regras_telegram.json ] && [ -f regras_telegram.example.json ]; then
            cp regras_telegram.example.json regras_telegram.json
          fi

      - name: Lançar Gastos Fixos do Mês
        if: ${{ github.event_name == 'schedule' || inputs.acao == 'lancar_fixos' || inputs.acao == 'ambos' }}
        run: |
          python lancar_fixos.py --notificar

      - name: Fechar Mês de Investimentos (Snapshot Patrimonial)
        if: ${{ inputs.acao == 'fechar_mes' || inputs.acao == 'ambos' }}
        run: |
          python atualizar_investimentos.py --fechar-mes
