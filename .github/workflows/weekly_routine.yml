name: Rotina Semanal (Investimentos e Resumo Financeiro)

on:
  schedule:
    # Todo domingo às 23:00 UTC (20:00 Horário de Brasília)
    - cron: '0 23 * * 0'
  workflow_dispatch:

concurrency:
  group: weekly-routine
  cancel-in-progress: false

jobs:
  weekly_report:
    name: Atualizar Carteira e Enviar Resumo Semanal
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Configurar Arquivo .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            echo "$ENV_FILE" > .env
          else
            echo "::error::Secret ENV_FILE não configurado no repositório GitHub!"
            exit 1
          fi

      - name: Preparar Arquivos de Regras
        run: |
          if [ ! -f regras_categoria.json ] && [ -f regras_categoria.example.json ]; then
            cp regras_categoria.example.json regras_categoria.json
          fi
          if [ ! -f regras_telegram.json ] && [ -f regras_telegram.example.json ]; then
            cp regras_telegram.example.json regras_telegram.json
          fi

      - name: Executar Rotina Semanal
        run: |
          python telegram_bot.py --semanal

      - name: Notificar Falha no Telegram
        if: failure()
        run: |
          if [ -f .env ]; then
            set -a
            . ./.env
            set +a
          fi
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "parse_mode=Markdown" \
              --data-urlencode "text=$(printf '🚨 *Falha na rotina:* %s\n%s/%s/actions/runs/%s' '${{ github.workflow }}' '${{ github.server_url }}' '${{ github.repository }}' '${{ github.run_id }}')" >/dev/null || true
          fi
